# Mosquitto — /etc/mosquitto/conf.d/default.conf
# Exige autenticação; usuários/senhas ficam no password_file (mosquitto_passwd).
# Sem TLS no piloto (perímetro via VPN). Antes de expor à internet: adicionar
# listener 8883 com certificados e ACL por dispositivo.

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
