# Mosquitto — /etc/mosquitto/conf.d/default.conf
#
# Só TCP. O pacote `mosquitto` do Debian NÃO é compilado com libwebsockets
# (confira com `ldd /usr/sbin/mosquitto | grep -c websocket`), então um
# `listener 9001 / protocol websockets` é aceito em silêncio e simplesmente
# não abre porta — config que mente.
#
# Para a borda alcançar o broker de fora da VPN, o caminho é o Cloudflare
# Tunnel carregando TCP: ingress `service: tcp://localhost:1883` no servidor e
# `cloudflared access tcp` na box, que expõe 127.0.0.1:1883 localmente. Assim
# nada muda aqui nem nos clientes.

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
