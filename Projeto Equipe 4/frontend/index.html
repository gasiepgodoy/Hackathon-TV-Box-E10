<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway IoT — Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">Gateway IoT</div>
        <div class="brand-sub">TV box · local</div>
      </div>
    </div>
    <nav class="nav">
      <a href="index.html" class="active"><i class="ti ti-chart-bar"></i> Dashboard</a>
      <a href="sensores.html"><i class="ti ti-plug"></i> Sensores</a>
      <a href="analise.html"><i class="ti ti-activity"></i> Análise</a>
    </nav>
    <div class="sidebar-footer">v1.0 · influxdb + websocket</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>Dashboard</h1>
      <div class="ws-status">
        <span class="ws-dot off" id="ws-dot"></span>
        <span id="ws-label">conectando…</span>
      </div>
    </div>

    <div class="content">

      <section class="panel">
        <div class="panel-title">Sensores</div>
        <div id="sensor-grid" class="sensor-grid">
          <div class="empty-state">Carregando sensores…</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">Filtros</div>
        <div class="controls-row">
          <div class="field">
            <label for="select-sensor">Sensor</label>
            <select id="select-sensor">
              <option value="">Todos os sensores</option>
            </select>
          </div>

          <div class="field">
            <label>Período</label>
            <div class="chip-row" id="chip-row">
              <div class="chip active" data-range="-1h">1 hora</div>
              <div class="chip" data-range="-24h">24 horas</div>
              <div class="chip" data-range="-7d">7 dias</div>
              <div class="chip" data-range="-30d">30 dias</div>
              <div class="chip" data-range="custom">Personalizado</div>
            </div>
          </div>

          <div class="field" id="campo-inicio" style="display:none">
            <label for="input-inicio">De</label>
            <input type="datetime-local" id="input-inicio">
          </div>
          <div class="field" id="campo-fim" style="display:none">
            <label for="input-fim">Até</label>
            <input type="datetime-local" id="input-fim">
          </div>

          <button id="btn-atualizar">Atualizar</button>
          <button id="btn-csv" class="primary"><i class="ti ti-download"></i> Baixar CSV</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">Histórico</div>
        <div class="chart-wrap">
          <canvas id="grafico"></canvas>
          <div class="chart-empty" id="chart-empty">Selecione um sensor e um período para ver os dados</div>
        </div>
      </section>

    </div>
  </div>
</div>

<div id="toast-area"></div>

<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
