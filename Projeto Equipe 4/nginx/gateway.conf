# Configuração de exemplo para a TV box.
# Copie para /etc/nginx/sites-available/gateway e crie um link em sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/gateway /etc/nginx/sites-enabled/gateway
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Arquivos estáticos do dashboard (index.html, sensores.html, css/, js/)
    root /var/www/gateway-iot/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # REST API do backend Python (FastAPI rodando em 127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket (precisa do upgrade de conexão explícito)
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
