<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160" role="img" aria-label="Gateway IoT Universal">
  <title>Gateway IoT Universal</title>

  <defs>
    <linearGradient id="nucleo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DE3B8"/>
      <stop offset="100%" stop-color="#1C7A5C"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35D6A8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#35D6A8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fundo próprio: mantém a logo legível tanto no tema claro quanto no
       escuro do GitHub, sem precisar de duas versões do arquivo. -->
  <rect width="620" height="160" rx="18" fill="#10141B"/>
  <rect width="620" height="160" rx="18" fill="url(#brilho)"/>

  <!-- ============ MARCA ============ -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="#171D27" stroke="#2A3240" stroke-width="1.5"/>

    <!-- Três entradas convergindo para um núcleo: protocolos distintos
         chegando e virando um fluxo único. Cores diferentes reforçam que
         a origem é heterogênea; a saída é uma só. -->
    <g fill="none" stroke-width="2.2" stroke-linecap="round">
      <path d="M30 34 C 48 34, 50 56, 62 60" stroke="#5B8DEF" stroke-opacity="0.75"/>
      <path d="M30 60 L 62 60" stroke="#F2A93C" stroke-opacity="0.75"/>
      <path d="M30 86 C 48 86, 50 64, 62 60" stroke="#E88BC5" stroke-opacity="0.75"/>
    </g>

    <g>
      <circle cx="30" cy="34" r="5" fill="#5B8DEF"/>
      <circle cx="30" cy="60" r="5" fill="#F2A93C"/>
      <circle cx="30" cy="86" r="5" fill="#E88BC5"/>
    </g>

    <!-- Núcleo do gateway -->
    <circle cx="70" cy="60" r="19" fill="#35D6A8" opacity="0.14"/>
    <circle cx="70" cy="60" r="12.5" fill="url(#nucleo)"/>

    <!-- Saída: fluxo normalizado seguindo para a análise -->
    <path d="M83 60 L 96 60" stroke="#35D6A8" stroke-width="2" stroke-linecap="round"/>
    <path d="M92 52 L 96 60 L 92 68" fill="none" stroke="#35D6A8" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ TIPOGRAFIA ============ -->
  <g font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="170" y="62" fill="#E7EAF0" font-size="35" font-weight="600" letter-spacing="-0.5">Gateway IoT</text>
    <text x="170" y="97" fill="#35D6A8" font-size="35" font-weight="600" letter-spacing="6.5">UNIVERSAL</text>
    <text x="172" y="123" fill="#5B6478" font-size="13.5"
          font-family="IBM Plex Mono, SF Mono, Consolas, monospace" letter-spacing="0.4">coleta · normaliza · analisa — na borda</text>
  </g>
</svg>
