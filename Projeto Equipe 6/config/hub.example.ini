# Copie para /etc/hub/hub.ini na TV box e ajuste conforme necessario.
[banco]
caminho = /var/lib/hub/dados.db

[mqtt]
host = localhost
port = 1883
topico = zigbee2mqtt/+
topico_lora = application/+/device/+/event/up
topico_saida = hub/lora/saida

[coletor]
lote_max = 20
intervalo_flush_s = 300

[agregador]
janela_s = 3600

[eventos]
temp_min = 3.0
temp_max = 40.0
umid_min = 20.0
umid_max = 95.0
bateria_min = 20
silencio_s = 3600
repetir_apos_s = 3600

[retencao]
dias_leituras = 90

[exportador]
# Pagina de download em http://192.168.4.1:8000 para quem conectar no AP.
# Mantenha o IP do AP aqui. Com 0.0.0.0 o banco fica exposto tambem na rede
# cabeada da universidade, onde a box tem IP publico — e sem autenticacao.
endereco = 192.168.4.1
porta = 8000
